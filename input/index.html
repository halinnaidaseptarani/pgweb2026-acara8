<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Input</title>
</head>
<body>

    <h2>Form Input Data Penduduk</h2>

    <form action="input.php" method="POST">
        <label for="kecamatan">Kecamatan:</label><br>
        <input type="text" id="kecamatan" name="kecamatan" required><br><br>

        <label for="longitude">Longitude:</label><br>
        <input type="text" id="longitude" name="longitude" required><br><br>

        <label for="latitude">Latitude:</label><br>
        <input type="text" id="latitude" name="latitude" required><br><br>

        <label for="luas">Luas:</label><br>
        <input type="text" id="luas" name="luas" required><br><br>

        <label for="jumlah_penduduk">Jumlah Penduduk:</label><br>
        <input type="number" id="jumlah_penduduk" name="jumlah_penduduk" required><br><br>

        <input type="submit" value="Kirim">
    </form>

</body>
</html>
